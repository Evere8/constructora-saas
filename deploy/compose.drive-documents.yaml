# Opt-in ONLY after provisioning /etc/constructora/project-docs/rclone.conf with a
# dedicated project-docs remote. Never mount the backup rclone.conf into API.
services:
  api:
    environment:
      DRIVE_DOCUMENT_REMOTE: "project-docs:"
      DRIVE_DOCUMENT_CONFIG: "/etc/constructora/project-docs/rclone.conf"
    volumes:
      # OAuth refresh rewrites the config atomically, so its dedicated directory
      # must be writable by UID 10001. No backup credentials are mounted.
      - type: bind
        source: /etc/constructora/project-docs
        target: /etc/constructora/project-docs
        bind:
          create_host_path: false
