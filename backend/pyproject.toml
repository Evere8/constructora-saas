[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "constructora-saas-api"
version = "0.1.0"
description = "API multiempresa para gestión de obras"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.5",
  "asyncmy==0.2.10",
  "cryptography==45.0.6",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "PyJWT==2.10.1",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "SQLAlchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
